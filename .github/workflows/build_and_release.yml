name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Run Tests
        working-directory: ./flutter_app
        run: flutter test

      - name: Build Android Release APK
        working-directory: ./flutter_app
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p release_output
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk release_output/ShopPOS-Release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShopPOS-Release-APK
          path: release_output/ShopPOS-Release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_output/ShopPOS-Release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
